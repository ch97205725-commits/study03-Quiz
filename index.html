<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상식 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="student-bar">학번 2601990 이름 최현지</div>

  <main class="app">
    <!-- 시작 화면 -->
    <section id="screen-start" class="screen">
      <h1 class="app-title">4지선다 상식 퀴즈</h1>
      <p class="lead">카테고리를 고른 뒤 모드(연습·스피드·힌트)를 선택하면 10문항이 나옵니다.</p>
      <p id="start-notice" class="notice">연습 모드는 순위표에 기록되지 않음</p>
      <p id="data-error" class="error" hidden>문항 데이터를 불러오지 못함</p>
      <div id="category-buttons" class="category-grid">
        <button type="button" class="category-btn" data-category="한국사">한국사</button>
        <button type="button" class="category-btn" data-category="세계지리">세계지리</button>
        <button type="button" class="category-btn" data-category="과학">과학</button>
        <button type="button" class="category-btn" data-category="예술과 문화">예술과 문화</button>
      </div>
    </section>

    <!-- 모드 선택 화면 -->
    <section id="screen-mode" class="screen" hidden>
      <h2 class="mode-title"><span id="mode-category"></span> · 모드 선택</h2>
      <div class="mode-cards">
        <button type="button" class="mode-card" data-mode="practice">
          <span class="mode-name">연습</span>
          <span class="mode-desc">시간 제한·힌트 없이 풀기 · 순위표에 기록되지 않음</span>
        </button>
        <button type="button" class="mode-card" data-mode="speed">
          <span class="mode-name">스피드</span>
          <span class="mode-desc">문항마다 15초</span>
        </button>
        <button type="button" class="mode-card" data-mode="hint">
          <span class="mode-name">힌트</span>
          <span class="mode-desc">문항마다 힌트 1번, 힌트 쓰고 맞히면 0.5점</span>
        </button>
      </div>
      <div class="mode-actions">
        <button type="button" id="mode-back-btn" class="secondary-btn">뒤로</button>
      </div>
    </section>

    <!-- 문제 화면 -->
    <section id="screen-quiz" class="screen" hidden>
      <div id="quiz-meta" class="quiz-meta">
        <span id="meta-category"></span>
        <span id="meta-mode"></span>
        <span id="meta-progress"></span>
        <span id="meta-score"></span>
      </div>
      <p id="timer" class="timer" hidden></p>
      <h2 id="quiz-question" class="quiz-question"></h2>
      <div id="choices" class="choices"></div>
      <button type="button" id="hint-btn" class="secondary-btn hint-btn" hidden>힌트</button>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <div id="explanation" class="explanation" hidden>
        <p id="explanation-text"></p>
        <p class="source">출처: <a id="source-link" target="_blank" rel="noopener"></a></p>
      </div>
      <div class="quiz-actions">
        <button type="button" id="next-btn" class="primary-btn" hidden>다음</button>
        <button type="button" id="quiz-home-btn" class="secondary-btn">처음으로</button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-result" class="screen" hidden>
      <h2>결과</h2>
      <p id="result-score" class="result-score"></p>
      <p id="result-first-score" hidden></p>
      <p id="result-notice" class="notice"></p>
      <ol id="result-summary" class="result-summary"></ol>
      <div class="result-actions">
        <button type="button" id="retry-btn" class="primary-btn" hidden>틀린 문제 다시 풀기</button>
        <button type="button" id="result-home-btn" class="secondary-btn">처음으로</button>
      </div>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
